name: Linux Store environment
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  store:
    name: Linux CPU Store acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: '3.13.17'
          enable-cache: true
      - name: Install CPU integration wheel
        run: uv sync --locked --group mooncake
      - name: Linux environment report
        run: uv run --locked --offline --no-sync python env/check_env.py --track linux-cpu
      - name: Isolated TCP Store acceptance
        run: uv run --locked --offline --no-sync python -m pytest -m integration
      - name: Upload environment report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-store-env
          path: env_report.json
          if-no-files-found: warn
