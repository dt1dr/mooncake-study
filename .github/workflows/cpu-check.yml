name: Portable CPU checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    name: CPU / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ['3.13']
        include:
          - os: ubuntu-24.04
            python: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install CPU dependencies
        run: uv sync --locked
      - name: Offline checks
        run: uv run --locked --offline --no-sync python -m common.cli check
      - name: Stage Conversation trace
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.13'
        run: uv run --locked --offline --no-sync python data/fetch.py conversation
      - name: Run and verify CPU labs offline
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.13'
        shell: bash
        run: |
          for lab in 01 02 03; do
            uv run --locked --offline --no-sync python -m common.cli run "$lab"
            uv run --locked --offline --no-sync python -m common.cli verify "$lab"
          done
      - name: CPU environment report
        run: uv run --locked --offline --no-sync python env/check_env.py --track portable-cpu
      - name: Upload environment and experiment results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpu-env-${{ matrix.os }}-${{ matrix.python }}
          path: |
            env_report.json
            labs/*/results/summary.json
            labs/*/results/*.png
          if-no-files-found: warn
