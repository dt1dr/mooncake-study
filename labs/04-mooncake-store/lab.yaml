claims:
  - id: tcp-store
    text: The pinned Store API transfers byte objects between processes over TCP.
    hypothesis: Separate producer and consumer retrieve identical seeded bytes with TCP evidence.
    method: Start an isolated master; sole writer owns a 64 MiB segment, reader mounts none. Compare 1 MiB seeded bytes in separate processes, record Linux TCP_INFO received bytes on the writer data port, close writer and require missing data, reject an unused master address with a native master-client error, reap all processes.
    paper_ref: *paper
    target_level: L0
    status: observed
    observed_level: L0
negative_controls: []
